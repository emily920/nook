<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ================= CONFIG — paste your Supabase project details here ================= */
const SUPABASE_URL = "https://zatuohfcphgcdbrdbugg.supabase.co";       // e.g. https://abcdefgh.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_I-vyaJa6XBiSw9-CNeInOg_j-TNmNx4";
/* ====================================================================================== */

const sb = (SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20)
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* ---------- design tokens ---------- */
const C = {
  board: "#E7E1CE", paper: "#FFFDF6", ink: "#2B2620", inkSoft: "#6B6355",
  coral: "#E85C41", mustard: "#E3A72E", sage: "#6FA98A", periwinkle: "#6E7FDB", line: "#D9D2BC",
};
const FONTS = `@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');`;
const display = { fontFamily: "'Caveat', cursive" };
const body = { fontFamily: "'Work Sans', sans-serif" };
const mono = { fontFamily: "'IBM Plex Mono', monospace" };
const AVATAR_COLORS = [C.coral, C.mustard, C.sage, C.periwinkle];
const CHIP_COLORS = AVATAR_COLORS;
const REACTIONS = ["😂", "👀", "🔥", "💀"];

function colorForId(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}
function initialsFor(name) {
  return (name || "?").trim().split(/\s+/).map((n) => n[0]).join("").slice(0, 2).toUpperCase();
}

/* ---------- inline icon set (no external icon library needed) ---------- */
function Icon({ children, size = 18, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {children}
    </svg>
  );
}
const Home = (p) => <Icon {...p}><path d="M3 9l9-7 9 7" /><path d="M9 22V12h6v10" /></Icon>;
const CalendarIcon = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></Icon>;
const Users = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const Shuffle = (p) => <Icon {...p}><polyline points="16 3 21 3 21 8" /><line x1="4" y1="20" x2="21" y2="3" /><polyline points="21 16 21 21 16 21" /><line x1="15" y1="15" x2="21" y2="21" /><line x1="4" y1="4" x2="9" y2="9" /></Icon>;
const Pin = (p) => <Icon {...p}><path d="M12 17v5" /><path d="M9 10h6l-1 5h-4z" /><path d="M9 3h6v7H9z" /></Icon>;
const MapPin = (p) => <Icon {...p}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></Icon>;
const Camera = (p) => <Icon {...p}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const UserPlus = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="8.5" cy="7" r="4" /><line x1="20" y1="8" x2="20" y2="14" /><line x1="17" y1="11" x2="23" y2="11" /></Icon>;
const Copy = (p) => <Icon {...p}><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></Icon>;
const ArrowLeft = (p) => <Icon {...p}><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></Icon>;
const ArrowRight = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></Icon>;
const CalendarPlus = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2" /><line x1="12" y1="12" x2="12" y2="18" /><line x1="9" y1="15" x2="15" y2="15" /></Icon>;

/* ---------- small components ---------- */
function Avatar({ name, color, size = 28 }) {
  return (
    <div style={{
      width: size, height: size, borderRadius: "50%", background: color, color: C.paper,
      display: "flex", alignItems: "center", justifyContent: "center", fontSize: size * 0.38,
      fontWeight: 600, ...body, border: `2px solid ${C.paper}`, flexShrink: 0,
    }}>
      {initialsFor(name)}
    </div>
  );
}

function Pushpin({ color }) {
  return (
    <div style={{ position: "absolute", top: -10, left: "50%", transform: "translateX(-50%)" }}>
      <div style={{ width: 12, height: 12, borderRadius: "50%", background: color, boxShadow: "0 2px 3px rgba(0,0,0,0.25)" }} />
    </div>
  );
}

async function uploadToMedia(file, prefix) {
  const path = `${prefix}/${Date.now()}-${file.name.replace(/\s+/g, "_")}`;
  const { error } = await sb.storage.from("media").upload(path, file);
  if (error) throw error;
  const { data } = sb.storage.from("media").getPublicUrl(path);
  return data.publicUrl;
}

/* ---------- post card ---------- */
function PostCard({ post, stickers, onReact, onAddSticker }) {
  const author = post.profiles || { name: "someone", color: C.inkSoft };
  const react = (key) => onReact(post.id, key, post.reactions || {});

  return (
    <div style={{
      position: "relative", background: C.paper, borderRadius: 4, padding: "18px 16px 14px",
      margin: "22px 10px", transform: `rotate(${post.rotation || 0}deg)`, boxShadow: "0 3px 8px rgba(43,38,32,0.15)",
    }}>
      <Pushpin color={author.color} />
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Avatar name={author.name} color={author.color} />
        <div>
          <div style={{ fontSize: 14, fontWeight: 600, ...body, color: C.ink }}>{author.name}</div>
          <div style={{ fontSize: 11, ...mono, color: C.inkSoft }}>{new Date(post.created_at).toLocaleString([], { hour: "numeric", minute: "2-digit", month: "short", day: "numeric" })}</div>
        </div>
      </div>

      {post.prompt_tag && (
        <div style={{
          display: "inline-block", fontSize: 11, ...body, fontStyle: "italic", color: C.inkSoft,
          background: `${C.mustard}26`, border: `1px solid ${C.mustard}88`, borderRadius: 20, padding: "2px 9px", marginBottom: 10,
        }}>
          answering: {post.prompt_tag}
        </div>
      )}

      {post.type === "photo" && post.photo_url ? (
        <div style={{ marginBottom: 10 }}>
          <img src={post.photo_url} alt="" style={{ width: "100%", maxHeight: 220, objectFit: "cover", borderRadius: 4, display: "block" }} />
          {post.content && <div style={{ fontSize: 13, ...body, color: C.ink, marginTop: 6 }}>{post.content}</div>}
        </div>
      ) : (
        <div style={{ fontSize: 15, ...body, color: C.ink, lineHeight: 1.5, marginBottom: 10 }}>{post.content}</div>
      )}

      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
        {REACTIONS.map((e) => {
          const count = (post.reactions || {})[e] || 0;
          return (
            <button key={e} onClick={() => react(e)} style={{
              border: `1px solid ${C.line}`, background: "transparent", borderRadius: 20, padding: "3px 9px",
              fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", gap: 4, ...body,
            }}>
              <span>{e}</span>
              {count > 0 && <span style={{ fontSize: 11, color: C.inkSoft }}>{count}</span>}
            </button>
          );
        })}
        {stickers.map((s) => {
          const count = (post.reactions || {})[s.id] || 0;
          return (
            <button key={s.id} onClick={() => react(s.id)} title={s.label} style={{
              border: `1px solid ${C.line}`, background: "transparent", borderRadius: 20, padding: "3px 7px",
              cursor: "pointer", display: "flex", alignItems: "center", gap: 4,
            }}>
              <img src={s.url} alt={s.label} style={{ width: 16, height: 16, borderRadius: 3, objectFit: "cover" }} />
              {count > 0 && <span style={{ fontSize: 11, color: C.inkSoft }}>{count}</span>}
            </button>
          );
        })}
        <StickerAdd onAdd={onAddSticker} />
      </div>
    </div>
  );
}

function StickerAdd({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [label, setLabel] = useState("");
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  const handleFile = (e) => {
    const f = e.target.files?.[0];
    if (f) { setFile(f); setPreview(URL.createObjectURL(f)); }
  };
  const submit = async () => {
    if (!file || busy) return;
    setBusy(true);
    try { await onAdd(file, label.trim() || "sticker"); }
    finally { setBusy(false); setFile(null); setPreview(null); setLabel(""); setOpen(false); }
  };

  if (!open) {
    return (
      <button onClick={() => setOpen(true)} style={{
        border: `1px dashed ${C.inkSoft}`, background: "transparent", borderRadius: 20, width: 26, height: 26,
        display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
      }} title="upload a custom sticker">
        <Plus size={13} color={C.inkSoft} />
      </button>
    );
  }
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 5, border: `1px solid ${C.line}`, borderRadius: 20, padding: "3px 6px", background: C.paper }}>
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
      {!file ? (
        <button onClick={() => inputRef.current?.click()} style={{ border: "none", background: "none", cursor: "pointer", fontSize: 11, ...body, color: C.inkSoft }}>choose image</button>
      ) : (
        <>
          <img src={preview} alt="" style={{ width: 20, height: 20, borderRadius: 4, objectFit: "cover" }} />
          <input value={label} onChange={(e) => setLabel(e.target.value)} placeholder="label" maxLength={14}
            style={{ width: 56, fontSize: 11, ...body, border: "none", outline: "none", background: "transparent" }} />
          <button onClick={submit} style={{ border: "none", background: "none", cursor: "pointer", padding: 2 }}>
            {busy ? <span style={{ fontSize: 10 }}>...</span> : <Check size={13} color={C.sage} />}
          </button>
        </>
      )}
      <button onClick={() => { setOpen(false); setFile(null); setPreview(null); setLabel(""); }} style={{ border: "none", background: "none", cursor: "pointer", padding: 2 }}>
        <X size={13} color={C.inkSoft} />
      </button>
    </div>
  );
}

function CaughtUp() {
  return (
    <div style={{ textAlign: "center", padding: "30px 30px 40px" }}>
      <div style={{ borderTop: `2px dashed ${C.inkSoft}66`, marginBottom: 18 }} />
      <div style={{ fontSize: 26, ...display, color: C.inkSoft }}>that's everything</div>
      <div style={{ fontSize: 13, ...body, color: C.inkSoft, marginTop: 4 }}>the board does not refresh itself. neither should you.</div>
    </div>
  );
}

function AddPromptChip({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [text, setText] = useState("");
  const submit = async () => { if (!text.trim()) return; await onAdd(text.trim()); setText(""); setOpen(false); };
  if (!open) {
    return (
      <button onClick={() => setOpen(true)} style={{ border: `1px dashed ${C.inkSoft}`, background: "transparent", borderRadius: 4, padding: "6px 10px", fontSize: 11, ...body, color: C.inkSoft, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
        <Plus size={11} /> add your own
      </button>
    );
  }
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 4, border: `1px solid ${C.line}`, borderRadius: 20, padding: "3px 6px", background: C.paper }}>
      <input value={text} onChange={(e) => setText(e.target.value)} placeholder="type a prompt..." maxLength={80} autoFocus
        style={{ width: 130, fontSize: 11, ...body, border: "none", outline: "none", background: "transparent" }} />
      <button onClick={submit} style={{ border: "none", background: "none", cursor: "pointer", padding: 2 }}><Check size={12} color={C.sage} /></button>
      <button onClick={() => { setOpen(false); setText(""); }} style={{ border: "none", background: "none", cursor: "pointer", padding: 2 }}><X size={12} color={C.inkSoft} /></button>
    </div>
  );
}

/* ---------- composer ---------- */
function Composer({ me, groupId, prompts, prompt, onShuffle, onClose, onSubmit, onAddPrompt }) {
  const [text, setText] = useState("");
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [posted, setPosted] = useState(false);
  const [busy, setBusy] = useState(false);
  const [mode, setMode] = useState("random");
  const [pickedPrompt, setPickedPrompt] = useState(null);
  const fileInputRef = useRef(null);

  const handleFile = (e) => {
    const f = e.target.files?.[0];
    if (f) { setFile(f); setPreview(URL.createObjectURL(f)); }
  };
  const effectivePrompt = mode === "skip" ? null : mode === "pick" ? pickedPrompt : prompt;
  const canPost = (text.trim().length > 0 || file) && !busy;

  const submit = async () => {
    if (!canPost) return;
    setBusy(true);
    try {
      let photo_url = null;
      if (file) photo_url = await uploadToMedia(file, "posts");
      await onSubmit({
        group_id: groupId, profile_id: me.id, type: file ? "photo" : "text",
        content: text.trim() || null, photo_url, prompt_tag: effectivePrompt, reactions: {},
      });
      setPosted(true);
    } catch (err) {
      alert("couldn't post — " + err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{ position: "absolute", inset: 0, background: "rgba(43,38,32,0.45)", display: "flex", alignItems: "flex-end", zIndex: 20 }} onClick={onClose}>
      <div style={{ background: C.board, width: "100%", borderRadius: "20px 20px 0 0", padding: 20, maxHeight: "85%", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontSize: 22, ...display, color: C.ink }}>pin something</div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}><X size={20} color={C.inkSoft} /></button>
        </div>

        {!posted ? (
          <>
            <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
              {["random", "pick", "skip"].map((m) => (
                <button key={m} onClick={() => setMode(m)} style={{
                  flex: 1, border: `1px solid ${mode === m ? C.coral : C.line}`,
                  background: mode === m ? `${C.coral}1a` : C.paper, color: mode === m ? C.coral : C.inkSoft,
                  borderRadius: 20, padding: "6px 0", fontSize: 12, ...body, cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
                }}>
                  {m === "random" && <Shuffle size={12} />} {m === "random" ? "random" : m === "pick" ? "choose one" : "skip"}
                </button>
              ))}
            </div>

            {mode === "pick" && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 10 }}>
                {prompts.map((p, i) => {
                  const color = CHIP_COLORS[i % CHIP_COLORS.length];
                  const active = pickedPrompt === p.text;
                  return (
                    <button key={p.id} onClick={() => setPickedPrompt(p.text)} title={p.text} style={{
                      maxWidth: 150, textAlign: "left", border: `1px solid ${active ? color : C.line}`,
                      background: active ? `${color}2e` : C.paper, color: C.ink, borderRadius: 4, padding: "6px 9px",
                      fontSize: 11, ...body, cursor: "pointer", transform: `rotate(${(i % 5) - 2}deg)`,
                      boxShadow: "0 1px 3px rgba(43,38,32,0.12)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                    }}>{p.text}</button>
                  );
                })}
                <AddPromptChip onAdd={onAddPrompt} />
              </div>
            )}

            {mode !== "skip" ? (
              effectivePrompt ? (
                <div style={{ background: `${C.mustard}33`, border: `1px dashed ${C.mustard}`, borderRadius: 4, padding: "8px 12px", fontSize: 13, ...body, color: C.ink, marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                  <span><i>{effectivePrompt}</i></span>
                  {mode === "random" && <button onClick={onShuffle} style={{ border: "none", background: "none", cursor: "pointer", flexShrink: 0 }}><Shuffle size={14} color={C.inkSoft} /></button>}
                </div>
              ) : (
                <div style={{ fontSize: 12, ...body, color: C.inkSoft, marginBottom: 12, fontStyle: "italic" }}>pick a sticky note above, or add your own.</div>
              )
            ) : (
              <div style={{ fontSize: 12, ...body, color: C.inkSoft, marginBottom: 12, fontStyle: "italic" }}>posting with no prompt attached.</div>
            )}

            {preview && (
              <div style={{ position: "relative", marginBottom: 10 }}>
                <img src={preview} alt="" style={{ width: "100%", maxHeight: 180, objectFit: "cover", borderRadius: 4, display: "block" }} />
                <button onClick={() => { setFile(null); setPreview(null); }} style={{ position: "absolute", top: 6, right: 6, width: 24, height: 24, borderRadius: "50%", background: "rgba(43,38,32,0.65)", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
                  <X size={13} color={C.paper} />
                </button>
              </div>
            )}

            <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="say something. or don't."
              style={{ width: "100%", minHeight: 80, borderRadius: 4, border: `1px solid ${C.line}`, padding: 10, fontSize: 14, ...body, resize: "none", boxSizing: "border-box", background: C.paper }} />
            <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
            <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
              <button onClick={() => fileInputRef.current?.click()} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, border: `1px solid ${C.line}`, borderRadius: 20, padding: "9px 0", background: C.paper, fontSize: 13, cursor: "pointer", ...body, color: C.inkSoft }}>
                <Camera size={15} /> {file ? "replace photo" : "upload photo"}
              </button>
              <button onClick={submit} disabled={!canPost} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, border: "none", borderRadius: 20, padding: "9px 0", background: canPost ? C.coral : C.line, color: C.paper, fontSize: 13, cursor: canPost ? "pointer" : "default", ...body, fontWeight: 600 }}>
                <Pin size={15} /> {busy ? "pinning..." : "pin it"}
              </button>
            </div>
          </>
        ) : (
          <div style={{ textAlign: "center", padding: "20px 0" }}>
            <Check size={26} color={C.sage} />
            <div style={{ fontSize: 20, ...display, color: C.ink, marginTop: 6 }}>pinned. congratulations.</div>
            <div style={{ fontSize: 12, ...body, color: C.inkSoft, marginTop: 4 }}>
              {effectivePrompt ? <>tagged as answering: <i>{effectivePrompt}</i></> : "posted with no prompt tag."}
            </div>
            <button onClick={onClose} style={{ marginTop: 12, border: "none", background: "none", color: C.periwinkle, fontSize: 13, cursor: "pointer", ...body }}>close</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- board / calendar / groups screens ---------- */
function BoardScreen({ posts, prompt, onShuffle, stickers, onReact, onAddSticker }) {
  return (
    <div style={{ paddingBottom: 20 }}>
      <div style={{ margin: "14px 14px 4px", background: `${C.mustard}30`, border: `1px dashed ${C.mustard}`, borderRadius: 4, padding: "10px 12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ fontSize: 15, ...body, color: C.ink }}>
          <span style={{ color: C.inkSoft, fontSize: 12 }}>today's prompt · </span><br />{prompt}
        </div>
        <button onClick={onShuffle} style={{ border: "none", background: "none", cursor: "pointer", padding: 6 }}><Shuffle size={16} color={C.inkSoft} /></button>
      </div>
      {posts.length === 0 && (
        <div style={{ textAlign: "center", padding: "50px 30px", fontSize: 14, ...body, color: C.inkSoft, fontStyle: "italic" }}>
          nobody's pinned anything here yet. be the annoying first one.
        </div>
      )}
      {posts.map((p) => <PostCard key={p.id} post={p} stickers={stickers} onReact={onReact} onAddSticker={onAddSticker} />)}
      {posts.length > 0 && <CaughtUp />}
    </div>
  );
}

function CalendarScreen({ groupId, groupName, events, onAddEvent }) {
  const days = Array.from({ length: 31 }, (_, i) => i + 1);
  const firstWeekday = 3; // July 1 2026 is a Wednesday
  const cells = [...Array(firstWeekday).fill(null), ...days];

  return (
    <div style={{ padding: "16px 14px 30px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div style={{ fontSize: 24, ...display, color: C.ink }}>july, {groupName.toLowerCase()}</div>
        <button onClick={onAddEvent} style={{ border: `1px solid ${C.periwinkle}`, background: `${C.periwinkle}14`, borderRadius: 20, padding: "6px 10px", display: "flex", alignItems: "center", gap: 4, cursor: "pointer" }}>
          <CalendarPlus size={14} color={C.periwinkle} />
        </button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4, marginBottom: 4 }}>
        {["s", "m", "t", "w", "t", "f", "s"].map((d, i) => <div key={i} style={{ textAlign: "center", fontSize: 11, ...mono, color: C.inkSoft }}>{d}</div>)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4 }}>
        {cells.map((day, i) => {
          const evs = day ? events.filter((e) => new Date(e.event_date).getUTCDate() === day) : [];
          return (
            <div key={i} style={{ aspectRatio: "1", borderRadius: 4, background: day ? C.paper : "transparent", border: day ? `1px solid ${C.line}` : "none", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative", fontSize: 12, ...body, color: C.ink }}>
              {day}
              {evs.length > 0 && <div style={{ position: "absolute", bottom: 4, display: "flex", gap: 2 }}>{evs.map((e, idx) => <div key={idx} style={{ width: 5, height: 5, borderRadius: "50%", background: C.coral }} />)}</div>}
            </div>
          );
        })}
      </div>
      <div style={{ marginTop: 20 }}>
        <div style={{ fontSize: 13, ...body, color: C.inkSoft, marginBottom: 8 }}>pinned to the calendar</div>
        {events.length === 0 && <div style={{ fontSize: 12, ...body, color: C.inkSoft, fontStyle: "italic" }}>nothing on the calendar yet.</div>}
        {events.map((e) => (
          <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 10, background: C.paper, border: `1px solid ${C.line}`, borderRadius: 4, padding: "8px 10px", marginBottom: 6 }}>
            <div style={{ width: 30, textAlign: "center", ...mono, fontSize: 13, color: C.coral, fontWeight: 500 }}>{new Date(e.event_date).getUTCDate()}</div>
            <div style={{ flex: 1, fontSize: 13, ...body, color: C.ink }}>{e.title}</div>
            <MapPin size={13} color={C.inkSoft} />
          </div>
        ))}
      </div>
    </div>
  );
}

function GroupsScreen({ groups, activeGroup, setActiveGroup, stickers, onInvite, onNewGroup }) {
  return (
    <div style={{ padding: "16px 14px 30px" }}>
      <div style={{ fontSize: 24, ...display, color: C.ink, marginBottom: 12 }}>your groups</div>
      {groups.map((g) => (
        <div key={g.id} onClick={() => setActiveGroup(g.id)} style={{
          background: C.paper, border: `1px solid ${activeGroup === g.id ? colorForId(g.id) : C.line}`,
          borderRadius: 8, padding: "12px 14px", marginBottom: 10, cursor: "pointer", borderLeft: `4px solid ${colorForId(g.id)}`,
        }}>
          <div style={{ fontSize: 16, ...body, fontWeight: 600, color: C.ink }}>{g.name}</div>
        </div>
      ))}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={onInvite} style={{ flex: 1, border: `1px solid ${C.periwinkle}`, background: `${C.periwinkle}14`, borderRadius: 8, padding: "12px 0", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 14, ...body, color: C.periwinkle, cursor: "pointer" }}>
          <UserPlus size={16} /> invite a friend
        </button>
        <button onClick={onNewGroup} style={{ flex: 1, border: `1px dashed ${C.inkSoft}`, background: "transparent", borderRadius: 8, padding: "12px 0", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 14, ...body, color: C.inkSoft, cursor: "pointer" }}>
          <Plus size={16} /> new group
        </button>
      </div>

      <div style={{ marginTop: 24 }}>
        <div style={{ fontSize: 18, ...display, color: C.ink, marginBottom: 4 }}>sticker pack</div>
        <div style={{ fontSize: 12, ...body, color: C.inkSoft, marginBottom: 10 }}>
          {stickers.length === 0 ? "nobody's uploaded a custom reaction yet. fix that on any post." : "custom reactions people have added. shows up on every post."}
        </div>
        {stickers.length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {stickers.map((s) => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 6, background: C.paper, border: `1px solid ${C.line}`, borderRadius: 20, padding: "4px 10px 4px 4px" }}>
                <img src={s.url} alt={s.label} style={{ width: 22, height: 22, borderRadius: 4, objectFit: "cover" }} />
                <span style={{ fontSize: 12, ...body, color: C.ink }}>{s.label}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function InviteModal({ onClose, onPreviewJoin }) {
  const [copied, setCopied] = useState(false);
  const link = window.location.href.split("?")[0];
  const copy = async () => {
    try { await navigator.clipboard.writeText(link); } catch {}
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };
  return (
    <div style={{ position: "absolute", inset: 0, background: "rgba(43,38,32,0.45)", display: "flex", alignItems: "flex-end", zIndex: 20 }} onClick={onClose}>
      <div style={{ background: C.board, width: "100%", borderRadius: "20px 20px 0 0", padding: 20 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontSize: 22, ...display, color: C.ink }}>invite a friend</div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}><X size={20} color={C.inkSoft} /></button>
        </div>
        <div style={{ fontSize: 12, ...body, color: C.inkSoft, marginBottom: 12 }}>
          just send them this exact link. no phone verification — whoever opens it picks a name and color and they're in, so only send it to people you'd trust with the board.
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: C.paper, border: `1px dashed ${C.periwinkle}`, borderRadius: 4, padding: "10px 12px", marginBottom: 14 }}>
          <span style={{ fontSize: 12, ...mono, color: C.ink, wordBreak: "break-all" }}>{link}</span>
          <button onClick={copy} style={{ border: "none", background: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
            {copied ? <Check size={15} color={C.sage} /> : <Copy size={15} color={C.periwinkle} />}
            <span style={{ fontSize: 11, ...body, color: copied ? C.sage : C.periwinkle }}>{copied ? "copied" : "copy"}</span>
          </button>
        </div>
        <button onClick={onPreviewJoin} style={{ width: "100%", border: `1px solid ${C.line}`, background: C.paper, borderRadius: 20, padding: "10px 0", fontSize: 13, ...body, color: C.inkSoft, cursor: "pointer" }}>
          preview what they'll see
        </button>
      </div>
    </div>
  );
}

function JoinFlow({ onComplete, onCancel, previewOnly }) {
  const [step, setStep] = useState(0);
  const [name, setName] = useState("");
  const [color, setColor] = useState(AVATAR_COLORS[0]);
  const [busy, setBusy] = useState(false);
  const steps = ["welcome", "name", "color", "done"];
  const next = () => setStep((s) => Math.min(s + 1, steps.length - 1));
  const back = () => (step === 0 ? onCancel() : setStep((s) => s - 1));
  const canContinue = step === 0 ? true : step === 1 ? name.trim().length > 0 : true;

  const finish = async () => {
    if (previewOnly) { onCancel(); return; }
    setBusy(true);
    try { await onComplete(name.trim(), color); }
    finally { setBusy(false); }
  };

  return (
    <div style={{ position: "absolute", inset: 0, background: C.board, display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 16px 0" }}>
        <button onClick={back} style={{ border: "none", background: "none", cursor: "pointer", padding: 4 }}><ArrowLeft size={18} color={C.inkSoft} /></button>
        <div style={{ display: "flex", gap: 5 }}>{steps.map((_, i) => <div key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: i <= step ? C.coral : C.line }} />)}</div>
        <div style={{ width: 18 }} />
      </div>
      <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", padding: "0 28px" }}>
        {step === 0 && (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 34, ...display, color: C.ink, marginBottom: 8 }}>you've been invited to nook</div>
            <div style={{ fontSize: 14, ...body, color: C.inkSoft }}>someone sent you this link directly. that's the whole verification system.</div>
          </div>
        )}
        {step === 1 && (
          <div>
            <div style={{ fontSize: 26, ...display, color: C.ink, marginBottom: 4 }}>what's your name</div>
            <div style={{ fontSize: 12, ...body, color: C.inkSoft, marginBottom: 14 }}>this is what your friends will see on your posts.</div>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Sam Osei" autoFocus
              style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.line}`, borderRadius: 4, padding: "10px 12px", fontSize: 15, ...body, background: C.paper }} />
          </div>
        )}
        {step === 2 && (
          <div>
            <div style={{ fontSize: 26, ...display, color: C.ink, marginBottom: 4 }}>pick your color</div>
            <div style={{ fontSize: 12, ...body, color: C.inkSoft, marginBottom: 14 }}>this is how you'll show up on the board.</div>
            <div style={{ display: "flex", gap: 12, justifyContent: "center", marginBottom: 10 }}>
              {AVATAR_COLORS.map((c) => (
                <button key={c} onClick={() => setColor(c)} style={{ width: 44, height: 44, borderRadius: "50%", background: c, cursor: "pointer", border: color === c ? `3px solid ${C.ink}` : `3px solid transparent` }} />
              ))}
            </div>
            <div style={{ display: "flex", justifyContent: "center" }}><Avatar name={name || "You"} color={color} size={44} /></div>
          </div>
        )}
        {step === 3 && (
          <div style={{ textAlign: "center" }}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}><Avatar name={name || "You"} color={color} size={56} /></div>
            <div style={{ fontSize: 30, ...display, color: C.ink, marginBottom: 6 }}>welcome, {name || "friend"}</div>
            <div style={{ fontSize: 13, ...body, color: C.inkSoft }}>you're in. no onboarding tour, just the board.</div>
          </div>
        )}
      </div>
      <div style={{ padding: 20 }}>
        <button onClick={step === steps.length - 1 ? finish : next} disabled={!canContinue || busy} style={{
          width: "100%", border: "none", borderRadius: 20, padding: "11px 0",
          background: canContinue ? C.coral : C.line, color: C.paper, fontSize: 14, ...body, fontWeight: 600,
          cursor: canContinue ? "pointer" : "default", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
        }}>
          {step === steps.length - 1 ? (busy ? "joining..." : "enter nook") : "continue"}
          {step !== steps.length - 1 && <ArrowRight size={15} />}
        </button>
      </div>
    </div>
  );
}

function ConfigNeeded() {
  return (
    <div style={{ maxWidth: 480, margin: "60px auto", padding: 24, background: "#fff", borderRadius: 8, fontFamily: "sans-serif", lineHeight: 1.6 }}>
      <h2>nook isn't connected to a database yet</h2>
      <p>Open this HTML file in a text editor, find the CONFIG section near the top, and paste in your Supabase project URL and anon key. See the setup instructions for where to find those.</p>
    </div>
  );
}

/* ---------- app shell ---------- */
function App() {
  const [me, setMe] = useState(null);
  const [loading, setLoading] = useState(true);
  const [screen, setScreen] = useState("main");
  const [previewJoin, setPreviewJoin] = useState(false);
  const [tab, setTab] = useState("board");
  const [showComposer, setShowComposer] = useState(false);
  const [showInvite, setShowInvite] = useState(false);

  const [groups, setGroups] = useState([]);
  const [activeGroupId, setActiveGroupId] = useState(null);
  const [posts, setPosts] = useState([]);
  const [prompts, setPrompts] = useState([]);
  const [stickers, setStickers] = useState([]);
  const [events, setEvents] = useState([]);
  const [promptIdx, setPromptIdx] = useState(0);

  // load identity + initial data
  useEffect(() => {
    if (!sb) { setLoading(false); return; }
    (async () => {
      const savedId = localStorage.getItem("nook_profile_id");
      if (savedId) {
        const { data } = await sb.from("profiles").select("*").eq("id", savedId).single();
        if (data) setMe(data); else localStorage.removeItem("nook_profile_id");
      }
      const { data: gs } = await sb.from("groups").select("*").order("created_at");
      setGroups(gs || []);
      if (gs && gs.length) setActiveGroupId(gs[0].id);
      const { data: ps } = await sb.from("prompts").select("*").order("created_at");
      setPrompts(ps || []);
      const { data: st } = await sb.from("stickers").select("*").order("created_at");
      setStickers(st || []);
      setLoading(false);
      if (!savedId) setScreen("join");
    })();
  }, []);

  // load posts + events for active group, with realtime subscriptions
  useEffect(() => {
    if (!sb || !activeGroupId) return;
    let cancelled = false;
    (async () => {
      const { data } = await sb.from("posts").select("*, profiles(name,color)").eq("group_id", activeGroupId).order("created_at", { ascending: false });
      if (!cancelled) setPosts(data || []);
      const { data: evs } = await sb.from("events").select("*").eq("group_id", activeGroupId).order("event_date");
      if (!cancelled) setEvents(evs || []);
    })();

    const channel = sb.channel("posts-" + activeGroupId)
      .on("postgres_changes", { event: "*", schema: "public", table: "posts", filter: `group_id=eq.${activeGroupId}` }, async (payload) => {
        if (payload.eventType === "INSERT") {
          const { data } = await sb.from("posts").select("*, profiles(name,color)").eq("id", payload.new.id).single();
          if (data) setPosts((prev) => [data, ...prev]);
        } else if (payload.eventType === "UPDATE") {
          setPosts((prev) => prev.map((p) => (p.id === payload.new.id ? { ...p, ...payload.new } : p)));
        }
      }).subscribe();

    return () => { cancelled = true; sb.removeChannel(channel); };
  }, [activeGroupId]);

  // realtime for prompts + stickers (shared across everyone)
  useEffect(() => {
    if (!sb) return;
    const ch = sb.channel("shared-lists")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "prompts" }, (payload) => setPrompts((prev) => [...prev, payload.new]))
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "stickers" }, (payload) => setStickers((prev) => [...prev, payload.new]))
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "groups" }, (payload) => setGroups((prev) => [...prev, payload.new]))
      .subscribe();
    return () => sb.removeChannel(ch);
  }, []);

  if (!sb) return <ConfigNeeded />;
  if (loading) return <div style={{ textAlign: "center", padding: 60, ...body, color: C.inkSoft }}>loading the board...</div>;

  const group = groups.find((g) => g.id === activeGroupId);
  const prompt = prompts.length ? prompts[promptIdx % prompts.length].text : "";
  const shuffle = () => setPromptIdx((i) => (i + 1 + Math.floor(Math.random() * Math.max(1, prompts.length - 1))) % Math.max(1, prompts.length));

  const completeJoin = async (name, color) => {
    const { data, error } = await sb.from("profiles").insert({ name, color }).select().single();
    if (error) { alert("couldn't join — " + error.message); return; }
    localStorage.setItem("nook_profile_id", data.id);
    setMe(data);
    setScreen("main");
  };

  const addPost = async (post) => {
    const { data, error } = await sb.from("posts").insert(post).select("*, profiles(name,color)").single();
    if (error) { throw error; }
    setPosts((prev) => [data, ...prev.filter((p) => p.id !== data.id)]);
  };

  const reactToPost = async (postId, key, currentReactions) => {
    const updated = { ...currentReactions, [key]: (currentReactions[key] || 0) + 1 };
    setPosts((prev) => prev.map((p) => (p.id === postId ? { ...p, reactions: updated } : p)));
    await sb.from("posts").update({ reactions: updated }).eq("id", postId);
  };

  const addSticker = async (file, label) => {
    const url = await uploadToMedia(file, "stickers");
    const { data } = await sb.from("stickers").insert({ url, label }).select().single();
    if (data) setStickers((prev) => [...prev.filter((s) => s.id !== data.id), data]);
  };

  const addPrompt = async (text) => {
    const { data } = await sb.from("prompts").insert({ text }).select().single();
    if (data) setPrompts((prev) => [...prev.filter((p) => p.id !== data.id), data]);
  };

  const addGroup = async () => {
    const name = window.prompt("Name this group:");
    if (!name || !name.trim()) return;
    const { data } = await sb.from("groups").insert({ name: name.trim() }).select().single();
    if (data) { setGroups((prev) => [...prev, data]); setActiveGroupId(data.id); }
  };

  const addEvent = async () => {
    const title = window.prompt("Event title?");
    if (!title || !title.trim()) return;
    const dayStr = window.prompt("Day of the month, July 2026 (1-31)?");
    const day = parseInt(dayStr, 10);
    if (!day || day < 1 || day > 31) return;
    const event_date = `2026-07-${String(day).padStart(2, "0")}`;
    const { data } = await sb.from("events").insert({ group_id: activeGroupId, title: title.trim(), event_date }).select().single();
    if (data) setEvents((prev) => [...prev, data].sort((a, b) => a.event_date.localeCompare(b.event_date)));
  };

  if (screen === "join") {
    return (
      <div style={{ display: "flex", justifyContent: "center", padding: "20px 0" }}>
        <style>{FONTS}</style>
        <div style={{ width: 400, height: 780, background: C.board, borderRadius: 32, overflow: "hidden", position: "relative", boxShadow: "0 8px 30px rgba(43,38,32,0.25)", border: `6px solid ${C.ink}` }}>
          <JoinFlow onComplete={completeJoin} onCancel={() => setScreen("main")} previewOnly={previewJoin} />
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", justifyContent: "center", padding: "20px 0" }}>
      <style>{FONTS}</style>
      <div style={{ width: 400, height: 780, background: C.board, borderRadius: 32, overflow: "hidden", position: "relative", boxShadow: "0 8px 30px rgba(43,38,32,0.25)", border: `6px solid ${C.ink}`, display: "flex", flexDirection: "column" }}>
        <div style={{ padding: "16px 16px 10px", flexShrink: 0 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 28, ...display, color: C.ink, fontWeight: 700 }}>nook</div>
            <button onClick={() => setShowComposer(true)} style={{ width: 34, height: 34, borderRadius: "50%", background: C.coral, border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
              <Plus size={18} color={C.paper} />
            </button>
          </div>
          <div style={{ display: "flex", gap: 8, overflowX: "auto", marginTop: 12, paddingBottom: 4 }}>
            {groups.map((g) => (
              <button key={g.id} onClick={() => setActiveGroupId(g.id)} style={{
                flexShrink: 0, border: `1px solid ${activeGroupId === g.id ? colorForId(g.id) : C.line}`,
                background: activeGroupId === g.id ? `${colorForId(g.id)}22` : C.paper,
                color: activeGroupId === g.id ? colorForId(g.id) : C.inkSoft,
                borderRadius: 20, padding: "6px 14px", fontSize: 13, ...body, fontWeight: 500, cursor: "pointer", whiteSpace: "nowrap",
              }}>{g.name}</button>
            ))}
          </div>
        </div>

        <div style={{ flex: 1, overflowY: "auto", position: "relative" }}>
          {tab === "board" && <BoardScreen posts={posts} prompt={prompt} onShuffle={shuffle} stickers={stickers} onReact={reactToPost} onAddSticker={addSticker} />}
          {tab === "calendar" && group && <CalendarScreen groupId={activeGroupId} groupName={group.name} events={events} onAddEvent={addEvent} />}
          {tab === "groups" && <GroupsScreen groups={groups} activeGroup={activeGroupId} setActiveGroup={setActiveGroupId} stickers={stickers} onInvite={() => setShowInvite(true)} onNewGroup={addGroup} />}
          {showComposer && me && (
            <Composer me={me} groupId={activeGroupId} prompts={prompts} prompt={prompt} onShuffle={shuffle} onClose={() => setShowComposer(false)} onSubmit={addPost} onAddPrompt={addPrompt} />
          )}
          {showInvite && <InviteModal onClose={() => setShowInvite(false)} onPreviewJoin={() => { setShowInvite(false); setPreviewJoin(true); setScreen("join"); }} />}
        </div>

        <div style={{ display: "flex", borderTop: `1px solid ${C.line}`, background: C.paper, flexShrink: 0 }}>
          {[["board", Home], ["calendar", CalendarIcon], ["groups", Users]].map(([id, IconComp]) => {
            const active = tab === id;
            return (
              <button key={id} onClick={() => setTab(id)} style={{ flex: 1, border: "none", background: "none", padding: "10px 0 8px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                <IconComp size={20} color={active ? C.coral : C.inkSoft} />
                <span style={{ fontSize: 11, ...body, color: active ? C.coral : C.inkSoft, fontWeight: active ? 600 : 400 }}>{id}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
